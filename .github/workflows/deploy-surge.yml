name: Deploy Morning Brief to Surge

on:
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - ".github/workflows/deploy-surge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surge-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Surge CLI
        run: npm install --global surge

      - name: Deploy production
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: surge ./public coco-morning-brief.surge.sh
